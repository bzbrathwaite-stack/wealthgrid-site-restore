<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WealthGrid — Your Financial Operating System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal: #0FAF9A;
      --teal-dim: rgba(15,175,154,0.15);
      --teal-glow: rgba(15,175,154,0.08);
      --green: #DBEE9F;
      --navy: #10102F;
      --black: #000000;
      --white: #FFFFFF;
      --grey: rgba(255,255,255,0.5);
      --grey-dim: rgba(255,255,255,0.12);
      --glass-bg: rgba(16,16,47,0.55);
      --glass-border: rgba(15,175,154,0.18);
      --font: 'Inter', sans-serif;
      --mono: 'DM Mono', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: var(--font);
      font-weight: 400;
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── ANIMATED BACKGROUND ─────────────────────────────── */
    .bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .bg-canvas::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 20%, rgba(15,175,154,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(219,238,159,0.04) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(16,16,47,0.8) 0%, transparent 80%);
    }
    .grid-dots {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(15,175,154,0.25) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridPulse 8s ease-in-out infinite;
    }
    @keyframes gridPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.5; }
    }

    /* ─── NAV ─────────────────────────────────────────────── */
